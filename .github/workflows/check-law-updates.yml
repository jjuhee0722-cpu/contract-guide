name: 법령 데이터 자동 업데이트

on:
  # schedule:
  #   # 매주 월요일 오전 9시 KST (= UTC 00:00)
  #   - cron: "0 0 * * 1"
  workflow_dispatch:   # 수동 실행 허용

jobs:
  update-law-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright 설치
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: 법제처 웹 스크래핑으로 법령 데이터 업데이트
        run: python scripts/update_law_data.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/contracts.json data/contracts.js; then
            echo "데이터 변경 없음 — 커밋 건너뜀"
          else
            git add data/contracts.json data/contracts.js
            git commit -m "chore: 법령 데이터 자동 업데이트 $(date +'%Y-%m-%d')"
            git push
            echo "✅ GitHub Pages 자동 배포 시작"
          fi
