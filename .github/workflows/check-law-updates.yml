name: 법령 데이터 자동 업데이트

on:
  schedule:
    # 매주 월요일 오전 9시 KST (= UTC 00:00)
    - cron: "0 0 * * 1"
  workflow_dispatch:   # 수동 실행 허용

jobs:
  update-law-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # contracts.json 커밋을 위해 필요

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 법제처 API로 법령 데이터 업데이트
        env:
          LAW_API_KEY: ${{ secrets.LAW_API_KEY }}
        run: python scripts/update_law_data.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 변경된 파일이 있을 때만 커밋
          if git diff --quiet data/contracts.json data/contracts.js; then
            echo "데이터 변경 없음 — 커밋 건너뜀"
          else
            git add data/contracts.json data/contracts.js
            git commit -m "chore: 법령 데이터 자동 업데이트 $(date +'%Y-%m-%d')"
            git push
            echo "✅ 업데이트 완료 — GitHub Pages 자동 배포 시작"
          fi
